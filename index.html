<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amrogn Chicken - Digital Menu</title>
    <style>
        :root { --primary: #d32f2f; --accent: #fbc02d; --bg: #fdfbf7; --text: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding-bottom: 40px; }
        
        .category-filter { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 20px 0; }
        .filter-btn { padding: 8px 16px; border-radius: 20px; background: #e0e0e0; color: #333; font-size: 0.9rem; font-weight: bold; transition: 0.2s; border: none; cursor: pointer; }
        .filter-btn.active, .filter-btn:hover { background: var(--primary); color: #fff; }

        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 3px solid var(--primary); margin-bottom: 20px; }
        header h1 { color: var(--primary); margin: 0; font-size: 2.5rem; }
        .category-title { color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 5px; margin-top: 30px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 15px; }
        .card { background: #ffffff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 4px solid var(--primary); display: flex; gap: 12px; align-items: center; }
        .card-img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: #f0f0f0; }
        .card-content { flex-grow: 1; display: flex; justify-content: space-between; align-items: center; }
        .card-info h3 { margin: 0 0 5px 0; font-size: 1.05rem; }
        .card-info p { margin: 0; font-size: 0.85rem; color: #666; }
        .price { font-weight: bold; color: var(--primary); font-size: 1.1rem; white-space: nowrap; margin-left: 10px; }
        
        .search-box { margin: 20px 0; text-align: center; }
        .search-box input { width: 80%; max-width: 400px; padding: 10px; border: 2px solid var(--primary); border-radius: 20px; outline: none; }
        
        .feedback-section { background: #fff; padding: 20px; border-radius: 8px; margin-top: 40px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .star-rating { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 5px; margin: 10px 0; }
        .star-rating input { display: none; }
        .star-rating label { font-size: 1.8rem; color: #ccc; cursor: pointer; }
        .star-rating input:checked ~ label, .star-rating label:hover, .star-rating label:hover ~ label { color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Amrogn Chicken</h1>
        <small style="color: #666;">We Speak Chicken!</small>
    </header>

    <!-- Search Bar -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search menu items..." onkeyup="filterMenu()">
    </div>

    <!-- Category Filter Bar -->
    <div class="category-filter" id="categoryButtons">
        <button class="filter-btn active" onclick="selectCategory('All')">All</button>
    </div>

    <!-- Menu Display Area -->
    <div id="menuContainer">
        <p style="text-align: center; color: #666;">Loading menu...</p>
    </div>

    <!-- Feedback Section -->
    <div class="feedback-section">
        <h2>Customer Reviews & Feedback</h2>
        <div id="feedbackMsg"></div>

        <form id="feedbackForm" style="margin-bottom: 30px;" onsubmit="submitFeedback(event)">
            <input type="text" id="customer_name" placeholder="Your Name" required style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">
            
            <label>Rating:</label>
            <div class="star-rating">
                <input type="radio" id="star5" name="rating" value="5" required><label for="star5">★</label>
                <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
                <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
                <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
                <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
            </div>
            
            <textarea id="comment" placeholder="Leave your review..." required style="width: 100%; height: 80px; padding: 8px; box-sizing: border-box;"></textarea>
            <button type="submit" style="background: var(--primary); color: #fff; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; margin-top: 10px; cursor: pointer;">Submit Feedback</button>
        </form>

        <h3>Recent Feedback</h3>
        <div id="reviewsContainer">
            <p style="color: #666;">No reviews submitted yet.</p>
        </div>
    </div>
</div>

<script>
    let allMenuItems = [];
    let currentCategory = 'All';

    // Fetch Menu Data from Server
    async function fetchMenu() {
        try {
            const res = await fetch('/api/menu');
            allMenuItems = await res.json();
            renderCategories();
            renderMenu();
        } catch (err) {
            document.getElementById('menuContainer').innerHTML = '<p style="color:red; text-align:center;">Failed to load menu items.</p>';
        }
    }

    function renderCategories() {
        const categories = ['All', ...new Set(allMenuItems.map(item => item.category))];
        const container = document.getElementById('categoryButtons');
        container.innerHTML = categories.map(cat => 
            `<button class="filter-btn ${cat === currentCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</button>`
        ).join('');
    }

    function selectCategory(cat) {
        currentCategory = cat;
        renderCategories();
        renderMenu();
    }

    function filterMenu() {
        renderMenu();
    }

    function renderMenu() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const container = document.getElementById('menuContainer');

        let filtered = allMenuItems.filter(item => {
            const matchesCat = currentCategory === 'All' || item.category === currentCategory;
            const matchesSearch = item.name.toLowerCase().includes(searchTerm) || (item.description && item.description.toLowerCase().includes(searchTerm));
            return matchesCat && matchesSearch;
        });

        if (filtered.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #666;">No menu items found.</p>';
            return;
        }

        // Group by category
        const grouped = {};
        filtered.forEach(item => {
            if (!grouped[item.category]) grouped[item.category] = [];
            grouped[item.category].push(item);
        });

        let html = '';
        for (const cat in grouped) {
            html += `<h2 class="category-title">${cat}</h2><div class="menu-grid">`;
            grouped[cat].forEach(item => {
                html += `
                    <div class="card">
                        ${item.image_url ? `<img src="${item.image_url}" alt="${item.name}" class="card-img">` : ''}
                        <div class="card-content">
                            <div class="card-info">
                                <h3>${item.name} ${item.variant ? `<small>(${item.variant})</small>` : ''}</h3>
                                ${item.description ? `<p>${item.description}</p>` : ''}
                            </div>
                            <div class="price">${Number(item.price).toLocaleString()} ETB</div>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
        }
        container.innerHTML = html;
    }

    function submitFeedback(e) {
        e.preventDefault();
        const msg = document.getElementById('feedbackMsg');
        msg.innerHTML = '<p style="color: green; font-weight: bold;">Thank you! Your feedback has been submitted.</p>';
        document.getElementById('feedbackForm').reset();
    }

    // Load initial data
    fetchMenu();
</script>
</body>
</html>
